<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Mando - Catálogo Lúdico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="bg-indigo-600 text-white p-6 rounded-xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold">Gestor del Catálogo de Juegos - DAW Games</h1>
                <p class="text-indigo-200 mt-1">Plataforma integral de administración API REST de daw-games - Desarrollado por Abraham Teba Ojeda</p>
            </div>
            <div class="space-x-3">
                <button onclick="recuperarInventarioCompleto()" class="bg-indigo-800 hover:bg-indigo-900 px-4 py-2 rounded-lg transition font-semibold">🔄 Restablecer Vista</button>
                <button onclick="extraerRankingExitos()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold px-4 py-2 rounded-lg transition shadow">⭐ Top 5 Bajadas</button>
            </div>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            
            <aside class="space-y-6 xl:col-span-1">
                
                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-sky-600">Explorador Avanzado</h2>
                    
                    <div class="space-y-4">
                        <div class="flex gap-2">
                            <input type="text" id="parametroDenominacion" placeholder="Buscar por título..." class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-sky-400">
                            <button onclick="filtrarPorDenominacion()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-2 rounded-md transition font-bold">🔎</button>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="parametroCategoria" placeholder="Buscar por categoría..." class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-sky-400">
                            <button onclick="filtrarPorCategoria()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-2 rounded-md transition font-bold">🔎</button>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="parametroSistema" placeholder="Buscar por sistema..." class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-sky-400">
                            <button onclick="filtrarPorSistema()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-2 rounded-md transition font-bold">🔎</button>
                        </div>

                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <label class="block text-xs font-bold text-slate-500 mb-2">Rango de Coste (€)</label>
                            <div class="flex gap-2 items-center">
                                <input type="number" id="parametroCosteMin" placeholder="Min" class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-sky-400">
                                <span class="text-slate-400">-</span>
                                <input type="number" id="parametroCosteMax" placeholder="Max" class="w-full p-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-sky-400">
                                <button onclick="filtrarPorRangoCoste()" class="bg-sky-500 hover:bg-sky-600 text-white px-3 py-2 rounded-md transition font-bold">Ir</button>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex flex-wrap gap-2 justify-center">
                            <button onclick="extraerPorClasificacion('base')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition w-full">Juegos Base</button>
                            <div class="flex gap-2 w-full">
                                <button onclick="extraerPorClasificacion('expansiones')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition flex-1">Expansiones</button>
                                <button onclick="extraerPorClasificacion('dlc')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 px-3 rounded-lg transition flex-1">DLCs</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-indigo-700">Registrar Título Inédito</h2>
                    <form id="bloqueAlta" class="space-y-3">
                        <div>
                            <input type="text" id="ingresoDenominacion" placeholder="Denominación..." required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <input type="text" id="ingresoCategoria" placeholder="Categoría temática..." required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <input type="text" id="ingresoSistemas" placeholder="Sistemas soportados..." required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="0.01" id="ingresoCoste" placeholder="Coste (€)" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                            <input type="number" id="ingresoBajadas" placeholder="Bajadas" required class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                        </div>
                        <div>
                            <select id="ingresoClasificacion" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-slate-600">
                                <option value="BASE">Juego Base</option>
                                <option value="EXPANSION">Expansión</option>
                                <option value="DLC">DLC</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-lg transition mt-2">Dar de Alta</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-rose-600">Rebaja Colectiva</h2>
                    <div class="space-y-3">
                        <input type="text" id="ingresoRebajaCategoria" placeholder="Filtrar categoría..." class="w-full p-2 border rounded-md outline-none focus:ring-2 focus:ring-rose-400 text-sm">
                        <input type="number" step="0.01" id="ingresoRebajaCuantia" placeholder="Coeficiente (Ej: 0.50)" class="w-full p-2 border rounded-md outline-none focus:ring-2 focus:ring-rose-400 text-sm">
                        <button onclick="ejecutarRebajaColectiva()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-4 rounded-lg transition">Ejecutar Modificación</button>
                    </div>
                </div>

            </aside>

            <main class="xl:col-span-3 bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden h-fit">
                <div class="p-6 border-b border-slate-100 bg-slate-50">
                    <h2 class="text-xl font-bold text-slate-700">Visor de Elementos</h2>
                </div>
                <div class="overflow-x-auto p-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-sm font-semibold text-slate-500 border-b-2 border-slate-200">
                                <th class="pb-3 px-2">Referencia</th>
                                <th class="pb-3 px-2">Denominación</th>
                                <th class="pb-3 px-2">Categoría</th>
                                <th class="pb-3 px-2">Coste Actual</th>
                                <th class="pb-3 px-2">Finalización</th>
                                <th class="pb-3 px-2 text-right">Controles</th>
                            </tr>
                        </thead>
                        <tbody id="areaVisualizacionFilas" class="text-sm divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </main>

        </div>
    </div>

    <script>
        const RUTA_CONEXION_SERVIDOR = 'http://localhost:8080/juegos';

        document.addEventListener('DOMContentLoaded', recuperarInventarioCompleto);

        // --- MÉTODOS DE EXTRACCIÓN (GET) ---
        
        function recuperarInventarioCompleto() {
            peticionLectura(RUTA_CONEXION_SERVIDOR);
        }

        function extraerRankingExitos() {
            peticionLectura(`${RUTA_CONEXION_SERVIDOR}/exitos`);
        }

        function filtrarPorDenominacion() {
            const valor = document.getElementById('parametroDenominacion').value;
            if(valor) peticionLectura(`${RUTA_CONEXION_SERVIDOR}/nombre?nombre=${valor}`);
        }

        function filtrarPorCategoria() {
            const valor = document.getElementById('parametroCategoria').value;
            if(valor) peticionLectura(`${RUTA_CONEXION_SERVIDOR}/genero?genero=${valor}`);
        }

        function filtrarPorSistema() {
            const valor = document.getElementById('parametroSistema').value;
            if(valor) peticionLectura(`${RUTA_CONEXION_SERVIDOR}/plataforma?plataforma=${valor}`);
        }

        function filtrarPorRangoCoste() {
            const min = document.getElementById('parametroCosteMin').value || 0;
            const max = document.getElementById('parametroCosteMax').value || 9999;
            peticionLectura(`${RUTA_CONEXION_SERVIDOR}/precio?min=${min}&max=${max}`);
        }

        function extraerPorClasificacion(rutaEspecifica) {
            peticionLectura(`${RUTA_CONEXION_SERVIDOR}/${rutaEspecifica}`);
        }

        // --- MÉTODOS DE ALTERACIÓN (POST, PUT, DELETE) ---

        document.getElementById('bloqueAlta').addEventListener('submit', function(evento) {
            evento.preventDefault(); 

            // Construcción del paquete usando las claves que exige el backend
            const paqueteEntrante = {
                nombre: document.getElementById('ingresoDenominacion').value,
                genero: document.getElementById('ingresoCategoria').value,
                plataformas: document.getElementById('ingresoSistemas').value,
                precio: parseFloat(document.getElementById('ingresoCoste').value),
                descargas: parseInt(document.getElementById('ingresoBajadas').value),
                tipo: document.getElementById('ingresoClasificacion').value
            };

            fetch(RUTA_CONEXION_SERVIDOR, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paqueteEntrante)
            })
            .then(respuesta => {
                if(respuesta.ok) {
                    document.getElementById('bloqueAlta').reset();
                    recuperarInventarioCompleto();
                } else {
                    return respuesta.text().then(texto => { throw new Error(texto) });
                }
            })
            .catch(error => alert('Fallo en la operación: ' + error.message));
        });

        function suprimirRegistro(clavePrimaria) {
            if(confirm('Se eliminará permanentemente. ¿Proceder?')) {
                fetch(`${RUTA_CONEXION_SERVIDOR}/${clavePrimaria}`, { method: 'DELETE' })
                .then(respuesta => {
                    if(respuesta.ok) recuperarInventarioCompleto();
                });
            }
        }

        function conmutarBanderaFinalizado(clavePrimaria) {
            fetch(`${RUTA_CONEXION_SERVIDOR}/${clavePrimaria}/completar`, { method: 'PUT' })
            .then(respuesta => {
                if(respuesta.ok) recuperarInventarioCompleto();
            });
        }

        function ejecutarRebajaColectiva() {
            const cat = document.getElementById('ingresoRebajaCategoria').value;
            const coef = document.getElementById('ingresoRebajaCuantia').value;

            fetch(`${RUTA_CONEXION_SERVIDOR}/descuento?genero=${cat}&porcentaje=${coef}`, { method: 'PUT' })
            .then(respuesta => {
                if(respuesta.ok) recuperarInventarioCompleto();
            });
        }

        // --- MOTOR DE RENDERIZADO ---

        function peticionLectura(ruta) {
            fetch(ruta)
                .then(respuesta => respuesta.json())
                .then(coleccion => pintarCuadricula(coleccion))
                .catch(error => console.error('Error de comunicación:', error));
        }

        function pintarCuadricula(coleccionDatos) {
            const lienzo = document.getElementById('areaVisualizacionFilas');
            lienzo.innerHTML = ''; 

            coleccionDatos.forEach(elemento => {
                const indicadorVisual = elemento.completado 
                    ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full text-xs font-bold cursor-pointer hover:bg-emerald-200 transition shadow-sm" onclick="conmutarBanderaFinalizado(${elemento.id})">Verificado</span>` 
                    : `<span class="bg-slate-100 text-slate-500 px-2 py-1 rounded-full text-xs font-bold cursor-pointer hover:bg-slate-200 transition shadow-sm" onclick="conmutarBanderaFinalizado(${elemento.id})">Pendiente</span>`;

                const bloqueHTML = `
                    <tr class="hover:bg-indigo-50 transition border-b border-slate-50 last:border-0">
                        <td class="py-3 px-2 font-mono text-slate-400">#${elemento.id}</td>
                        <td class="py-3 px-2 font-semibold text-indigo-900">${elemento.nombre}</td>
                        <td class="py-3 px-2 text-slate-600">${elemento.genero} <br><span class="text-xs font-bold text-indigo-400">${elemento.tipo}</span></td>
                        <td class="py-3 px-2 font-bold text-slate-700">${elemento.precio.toFixed(2)} €</td>
                        <td class="py-3 px-2">${indicadorVisual}</td>
                        <td class="py-3 px-2 text-right">
                            <button onclick="suprimirRegistro(${elemento.id})" class="text-rose-500 hover:bg-rose-500 hover:text-white font-semibold px-3 py-1 bg-rose-50 rounded transition">Eliminar</button>
                        </td>
                    </tr>
                `;
                lienzo.insertAdjacentHTML('beforeend', bloqueHTML);
            });
        }
    </script>
</body>
</html>
